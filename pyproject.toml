# The installable code release of pipeline/ (RELEASE_NOTES.md). Installs as ONE top-level package, sae_ethos_pipeline,
# whose directory is pipeline/. Importing it puts that directory on sys.path, so the pipeline's own absolute imports
# (`import modelcfg`, `from harness import ...`) resolve exactly as they do on a pod (cwd pipeline/).
#   pip install "git+https://github.com/RandallSPQR/SAE-Ethos-Calibration@v1.0.0"
#   pip install "sae-ethos-pipeline[replay] @ git+https://github.com/RandallSPQR/SAE-Ethos-Calibration@v1.0.0"
# Deliberately excluded: runs/, results/, model weights, the rendered scenario builds and every dataset.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sae-ethos-pipeline"
version = "1.0.0"
description = "Transgression-calibration pipeline for open-weight chat models: T3 agent harness, labeler, gates, provenance, replay and text-effect analyses (Gemma-2-9B-IT, Gemma-3-27B-IT)"
readme = "RELEASE_NOTES.md"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "numpy>=1.24"]

[project.optional-dependencies]
# the pinned replay / probe stack (config/models_gemma-3-27b-it.yaml replay.pins; TorchBackend.check_pins STOPs on a mismatch)
replay = ["torch==2.8.0", "nnsight==0.7.0", "transformers==5.17.0", "accelerate==1.15.0", "pyarrow"]
# tokenizer / chat-template checks only (modelcfg.check_tokenizer, model_io/test_gemma3.py)
tokenizer = ["transformers==5.17.0", "jinja2"]
analysis = ["scipy"]

[project.urls]
Repository = "https://github.com/RandallSPQR/SAE-Ethos-Calibration"

[tool.setuptools]
package-dir = { "sae_ethos_pipeline" = "pipeline" }
packages = [
  "sae_ethos_pipeline",
  "sae_ethos_pipeline.analyze", "sae_ethos_pipeline.calibrate", "sae_ethos_pipeline.gates",
  "sae_ethos_pipeline.generate", "sae_ethos_pipeline.harness", "sae_ethos_pipeline.model_io",
  "sae_ethos_pipeline.probe", "sae_ethos_pipeline.replay", "sae_ethos_pipeline.resample",
]
include-package-data = false

[tool.setuptools.package-data]
"sae_ethos_pipeline" = ["config/*.yaml", "contracts/*.md", "*.md"]
"sae_ethos_pipeline.calibrate" = ["*.sh"]
"sae_ethos_pipeline.harness" = ["*_FREEZE.json", "CHANGELOG.md", "LABELER_CHANGELOG.md"]
"sae_ethos_pipeline.probe" = ["*_FREEZE.json"]
"sae_ethos_pipeline.gates" = ["CHANGELOG.md"]
"sae_ethos_pipeline.model_io" = ["fixtures/*"]
"sae_ethos_pipeline.analyze" = ["*.md"]

[tool.setuptools.exclude-package-data]
# claude-mem writes placeholder CLAUDE.md files beside touched paths; they are editor droppings, not part of the release
"*" = ["CLAUDE.md"]

[tool.pipeline]
# the intended order (enforced by pipeline/Makefile, not by this table); moved here from the 0.1.0 scaffold pipeline/pyproject.toml
order = ["render", "seeds", "gates-nogpu", "generate", "resample", "gates", "replay", "analyze"]
