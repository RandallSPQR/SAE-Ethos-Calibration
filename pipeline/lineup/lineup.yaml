# One serving stack for all five models, in its own venv (venv_vllm_lineup), beside and independent of the SAE studies'
# vLLM 0.11.0 (calibrate/pod_bootstrap.sh, unchanged). vLLM 0.11.0 cannot serve Qwen3.5 (no Qwen3_5ForConditionalGeneration
# in its registry); 0.19.1 is the release chosen: it serves all five architectures (registry checked at the v0.19.1 tag),
# and its transformers / tokenizers / huggingface-hub pins are the versions vLLM's own test requirements use at that tag.
serving:
  python: "3.11"
  pins: {vllm: "0.19.1", torch: "2.10.0", transformers: "5.5.3", tokenizers: "0.22.2", huggingface-hub: "1.10.2"}
  batch_size: 1                            # --max-num-seqs 1: one sequence in flight, so no cross-request batching effects
  determinism:
    flags: ["--max-num-seqs 1", "--no-enable-prefix-caching", "--max-num-batched-tokens 8192", "--seed 0",
            "--logprobs-mode raw_logprobs", "--dtype bfloat16",
            # 1.2.1: without these two (and VLLM_BATCH_INVARIANT below), logprobs moved by 1-2 bf16 steps (up to 0.25
            # nats) across server starts for 4 of 5 models; with them, bit-identical across cold starts (RELEASE_NOTES.md)
            "--enforce-eager", "--attention-backend FLASH_ATTN"]
    env: {CUBLAS_WORKSPACE_CONFIG: ":4096:8", PYTHONHASHSEED: "0", TOKENIZERS_PARALLELISM: "false",
          VLLM_BATCH_INVARIANT: "1"}
    # established on this GPU type only (per model: within a start and across cold starts); another type needs the
    # box check again
    gpu_type: "NVIDIA RTX PRO 6000 Blackwell Server Edition"
    # The box check (lineup.identity box) requires bit-identical readouts over repeated identical requests before a
    # model is used; "deterministic kernels" is established there, per model and GPU type, not assumed.
    repeat_probe: {requests: 8, require: "bit-identical logprobs for the readout tokens"}
  readout:
    endpoint: "/v1/completions"            # prompt = the canonical serializer's token ids; the server's template is never used
    max_tokens: 1
    top_logprobs: 20
    temperature: 0.0
    exact_fallback: "allowed_token_ids"    # an option outside the top 20 is read exactly by a second request restricted to it
